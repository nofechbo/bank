services:
  frontend:
    build:
      context: ./bank_fe
      dockerfile: Dockerfile.dev  # prod: Dockerfile.prod
    ports:
      - "5173:5173"  # dev
      # - "80:80"    # prod
    restart: unless-stopped
    depends_on: 
      - backend
    env_file: ./bank_fe/.env

  backend:
    build:
      context: ./bank_be
      dockerfile: Dockerfile.dev  # prod: Dockerfile.prod
    command: sh -c "npx prisma migrate dev && npm run dev" # prod: sh -c "npx prisma migrate deploy && npm start"
    ports: 
      - "3030:3030"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3030/healthcheck').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    env_file: ./bank_be/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tuna_bank}:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/${POSTGRES_DB:-mybankdb}
    depends_on: 
        db:
          condition: service_healthy

  db:
    image: postgres:15
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tuna_bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-mybankdb}
    volumes: 
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
